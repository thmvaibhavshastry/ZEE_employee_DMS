{% extends "base.html" %}
{% block auth_inner %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius:16px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width:56px;height:56px;background:linear-gradient(135deg,#7c3aed,#5b21b6);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                            <i class="bi bi-brightness-high-fill fs-3 text-white"></i>
                        </div>
                        <h4 class="fw-bold">Employee Management System</h4>
                        <p class="text-muted small">Sign in to your account</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="username" class="form-control bg-light border-start-0" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-start-0" required>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" class="form-check-input" id="remember">
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                        <button type="submit" class="btn w-100 text-white fw-semibold py-2" style="background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:10px;">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="mb-1 small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
