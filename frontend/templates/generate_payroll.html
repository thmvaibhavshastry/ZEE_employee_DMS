{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-plus-circle"></i> Generate Payroll</h3>
        <a href="{{ url_for('payroll.list_payroll') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" id="payrollForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Employee *</label>
                        <select name="employee_id" id="employee_id" class="form-select" required>
                            <option value="">Select Employee</option>
                            {% for e in employees %}
                            <option value="{{ e.id }}">{{ e.first_name }} {{ e.last_name }} ({{ e.employee_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Month *</label>
                        <select name="month" class="form-select" required>
                            {% for m in range(1, 13) %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Year *</label>
                        <input type="number" name="year" class="form-control" value="2026" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Payment Date *</label>
                        <input type="date" name="payment_date" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Basic Salary (₹) *</label>
                        <input type="number" step="0.01" name="basic_salary" id="basic_salary" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">HRA (₹)</label>
                        <input type="number" step="0.01" name="hra" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Dearness Allowance (₹)</label>
                        <input type="number" step="0.01" name="da" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Other Allowances (₹)</label>
                        <input type="number" step="0.01" name="allowances" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tax Deduction (₹)</label>
                        <input type="number" step="0.01" name="tax" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">PF Deduction (₹)</label>
                        <input type="number" step="0.01" name="pf" class="form-control" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Other Deductions (₹)</label>
                        <input type="number" step="0.01" name="deductions" class="form-control" value="0">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Remarks</label>
                        <textarea name="remarks" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Generate Payroll</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('#employee_id').change(function() {
    const id = $(this).val();
    if (id) {
        $.getJSON('/payroll/api/employee-salary/' + id, function(data) {
            $('#basic_salary').val(data.salary);
        });
    }
});
</script>
{% endblock %}
