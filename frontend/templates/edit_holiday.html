{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-pencil"></i> Edit Holiday</h3>
        <a href="{{ url_for('holidays.list_holidays') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Holiday Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ holiday.name }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" value="{{ holiday.date.strftime('%Y-%m-%d') }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Type *</label>
                        <select name="type" class="form-select" required>
                            <option value="national" {% if holiday.type == 'national' %}selected{% endif %}>National</option>
                            <option value="festival" {% if holiday.type == 'festival' %}selected{% endif %}>Festival</option>
                            <option value="regional" {% if holiday.type == 'regional' %}selected{% endif %}>Regional</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <div class="form-check">
                            <input type="checkbox" name="is_optional" class="form-check-input" id="optional" {% if holiday.is_optional %}checked{% endif %}>
                            <label class="form-check-label" for="optional">Optional Holiday</label>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="2">{{ holiday.description or '' }}</textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Update Holiday</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
