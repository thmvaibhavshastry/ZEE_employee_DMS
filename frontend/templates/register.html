{% extends "base.html" %}
{% block auth_inner %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0" style="border-radius:16px;">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="width:56px;height:56px;background:linear-gradient(135deg,#7c3aed,#5b21b6);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
                            <i class="bi bi-person-plus-fill fs-3 text-white"></i>
                        </div>
                        <h4 class="fw-bold">Create Account</h4>
                        <p class="text-muted small">Register your admin account</p>
                    </div>
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <input type="text" name="username" class="form-control bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Email</label>
                            <input type="email" name="email" class="form-control bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Password</label>
                            <input type="password" name="password" class="form-control bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control bg-light" required>
                        </div>
                        <button type="submit" class="btn w-100 text-white fw-semibold py-2" style="background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:10px;">
                            Register
                        </button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="mb-1 small text-muted">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
