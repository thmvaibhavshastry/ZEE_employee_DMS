{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-pencil"></i> Edit Employee</h3>
        <a href="{{ url_for('employees.list_employees') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">First Name *</label>
                        <input type="text" name="first_name" class="form-control" value="{{ employee.first_name }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Last Name *</label>
                        <input type="text" name="last_name" class="form-control" value="{{ employee.last_name }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ employee.phone or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select">
                            <option value="">Select Department</option>
                            {% for dept in ['Engineering', 'Marketing', 'Sales', 'HR', 'Finance', 'Operations', 'Design'] %}
                            <option value="{{ dept }}" {% if employee.department == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Designation</label>
                        <input type="text" name="designation" class="form-control" value="{{ employee.designation or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control" value="{{ employee.date_of_birth.strftime('%Y-%m-%d') if employee.date_of_birth else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Date of Joining</label>
                        <input type="date" name="date_of_joining" class="form-control" value="{{ employee.date_of_joining.strftime('%Y-%m-%d') if employee.date_of_joining else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Salary (₹)</label>
                        <input type="number" step="0.01" name="salary" class="form-control" value="{{ employee.salary }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Reporting Manager</label>
                        <select name="reporting_manager_id" class="form-select">
                            <option value="">No Manager (Self)</option>
                            {% for mgr in managers %}
                            <option value="{{ mgr.id }}" {% if employee.reporting_manager_id == mgr.id %}selected{% endif %}>
                                {{ mgr.first_name }} {{ mgr.last_name }} ({{ mgr.department or 'N/A' }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ employee.address or '' }}</textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Update Employee
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
